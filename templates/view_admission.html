{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h2 class="page-title">Admissions List</h2>

    <div class="table-card">
        <table class="styled-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Admit Date</th>
                    <th>Discharge Date</th>
                </tr>
            </thead>
            <tbody>
                {% for a in admissions %}
                <tr>
                    <td>{{ a[0] }}</td>
                    <td>{{ a[1] }}</td>
                    <td>{{ a[2] }}</td>
                    <td>{{ a[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
