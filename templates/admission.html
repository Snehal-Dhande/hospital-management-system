{% extends "base.html" %}
{% block content %}

<h2>Admission</h2>

<form method="POST" action="/admission">
    <input type="number" name="patient_id" placeholder="Patient ID" required><br><br>
    <input type="text" name="room_no" placeholder="Room Number" required><br><br>
    <input type="date" name="admit_date" required><br><br>

    <button type="submit">Admit Patient</button>
</form>

{% endblock %}
