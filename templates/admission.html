{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h2 class="page-title">Patient Admission</h2>

    <div class="form-card">
        <form method="POST" action="/admission">

            <!-- Patient Dropdown -->
            <select name="patient_id" class="form-input" required>
                <option value="">Select Patient</option>
                {% for patient in patients %}
                    <option value="{{ patient[0] }}">{{ patient[1] }}</option>
                {% endfor %}
            </select>

            <!-- Admit Date -->
            <input
                type="date"
                name="admit_date"
                class="form-input"
                required
            >

            <!-- Discharge Date -->
            <input
                type="date"
                name="discharge_date"
                class="form-input"
            >

            <button type="submit" class="btn-primary">
                Admit Patient
            </button>
        </form>
    </div>
</div>
{% endblock %}
