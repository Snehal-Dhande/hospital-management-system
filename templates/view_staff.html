<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Staff</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="/home">Home</a>
    <a href="/add_patient">Add Patient</a>
    <a href="/view_patients">View Patients</a>
    <a href="/add_staff">Add Staff</a>
    <a href="/view_staff">View Staff</a>
    <a href="/admission">Admission</a>
    <a href="/view_admission">Admissions</a>
</nav>

<h2 class="page-title">Staff List</h2>

<div class="table-container">
    <table class="styled-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Contact</th>
            </tr>
        </thead>
        <tbody>
            {% for staff in staff_list %}
            <tr>
                <td>{{ staff.id }}</td>
                <td>{{ staff.name }}</td>
                <td>{{ staff.role }}</td>
                <td>{{ staff.contact }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align:center;">No staff found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div class="bottom-links">
    <a href="/add_staff">Add Staff</a>
    <a href="/logout">Logout</a>
</div>

</body>
</html>
